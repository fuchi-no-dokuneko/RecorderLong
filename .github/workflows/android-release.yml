name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Validate and decode signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -Eeuo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required release setting: ${name}"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore
          keytool -list \
            -keystore release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed release artifacts
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true
        run: |
          set -Eeuo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Verify signatures and certificate identity
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -Eeuo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' -print)
          mapfile -t bundles < <(find app/build/outputs/bundle/release -type f -name '*.aab' -print)
          test "${#apks[@]}" -eq 1
          test "${#bundles[@]}" -eq 1
          apksigner verify --verbose --print-certs "${apks[0]}" | tee certificate-report.txt
          jarsigner -verify "${bundles[0]}" >/dev/null
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' certificate-report.txt | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          bundle_actual="$(keytool -printcert -jarfile "${bundles[0]}" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$actual"
          test -n "$bundle_actual"
          if [ "$actual" != "$expected" ] || [ "$bundle_actual" != "$expected" ]; then
            echo "::error::Release certificate digest does not match ANDROID_CERT_SHA256."
            exit 1
          fi
          printf '%s\n' "$actual" > certificate-sha256.txt

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recorderlong-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            certificate-report.txt
            certificate-sha256.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            certificate-report.txt
            certificate-sha256.txt

      - name: Remove signing material
        if: always()
        run: rm -f release.keystore
