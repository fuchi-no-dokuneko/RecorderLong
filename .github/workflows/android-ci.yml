name: Android CI

on:
  push:
    branches: [main, "tickets/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit, lint, build, and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
      - name: Run unit coverage, lint, and build
        run: |
          mkdir -p build/reports
          ./gradlew :app:createDebugUnitTestCoverageReport :app:lintDebug :app:assembleDebug --stacktrace
          ./gradlew :app:dependencies > build/reports/android-dependencies.txt
      - name: Run real ffmpeg rescue tests with Python coverage
        run: python3 .github/scripts/run-python-coverage.py
      - name: Verify immutable security workflows
        run: |
          python3 .github/scripts/verify-workflow-pins.py
          python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py'
      - name: Summarize reports
        if: always()
        run: python3 .github/scripts/summarize-android-reports.py
      - name: Upload unit, lint, and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-unit-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/coverage/test/
            app/build/reports/lint-results-debug.*
            app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes/
            build/reports/python/
            build/reports/security-evidence.json
            build/reports/android-dependencies.txt
            build/reports/ci-summary.md
          if-no-files-found: warn
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recorderlong-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  uat:
    name: Emulator UAT and coverage
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation UAT with coverage
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run-android-uat.sh
      - name: Summarize reports
        if: always()
        run: python3 .github/scripts/summarize-android-reports.py
      - name: Upload UAT and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-uat-reports
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/reports/coverage/androidTest/
            build/reports/android-uat.log
            build/reports/ci-summary.md
          if-no-files-found: warn

  coverage-gate:
    name: Merged 95 percent coverage gate
    needs: [unit, uat]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Restore unit, Python, and security evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-unit-reports
          path: .
      - name: Restore device coverage evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-uat-reports
          path: .
      - name: Enforce merged maintained-source coverage and evidence
        run: |
          python3 .github/scripts/merge-coverage.py \
            --jacoco app/build/reports/coverage/test/debug/report.xml \
            --jacoco app/build/reports/coverage/androidTest/debug/connected/report.xml \
            --python build/reports/python/coverage.xml \
            --device-report app/build/reports/coverage/androidTest/debug/connected/report.xml \
            --media-evidence build/reports/python/media-evidence.json \
            --security-evidence build/reports/security-evidence.json \
            --threshold 95
      - name: Upload merged gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recorderlong-merged-coverage
          path: build/reports/merged-coverage.json
          if-no-files-found: error

  sonar:
    name: SonarQube Cloud coverage
    needs: [unit, uat, coverage-gate]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Restore unit coverage and compiled classes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-unit-reports
          path: .
      - name: Restore instrumentation coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-uat-reports
          path: .
      - name: Verify SonarQube input reports
        run: |
          test -s app/build/reports/coverage/test/debug/report.xml
          test -s app/build/reports/coverage/androidTest/debug/connected/report.xml
          test -s build/reports/python/coverage.xml
          test -s build/reports/python/media-evidence.json
          test -d app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
      - name: Require SonarQube Cloud token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Missing SONAR_TOKEN repository secret; coverage cannot be published."
            exit 1
          fi
      - name: Run SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
