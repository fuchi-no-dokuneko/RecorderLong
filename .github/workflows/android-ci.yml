name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit, lint, build, and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
      - name: Run unit coverage, lint, and build
        run: ./gradlew :app:createDebugUnitTestCoverageReport :app:lintDebug :app:assembleDebug --stacktrace
      - name: Run SonarQube Cloud analysis
        if: vars.SONARQUBE_CLOUD_ENABLED == 'true'
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Summarize reports
        if: always()
        run: python3 .github/scripts/summarize-android-reports.py
      - name: Upload unit, lint, and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/coverage/test/
            app/build/reports/lint-results-debug.*
            build/reports/ci-summary.md
          if-no-files-found: warn
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: recorderlong-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  uat:
    name: Emulator UAT and coverage
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation UAT with coverage
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run-android-uat.sh
      - name: Summarize reports
        if: always()
        run: python3 .github/scripts/summarize-android-reports.py
      - name: Upload UAT and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-uat-reports
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/reports/coverage/androidTest/
            build/reports/android-uat.log
            build/reports/ci-summary.md
          if-no-files-found: warn
